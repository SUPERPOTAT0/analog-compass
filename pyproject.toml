[project]
name = "analog-compass"
version = "0.1.0"
description = "Test-led, evidence-based Earth analogue finder for Moon/Mars field campaigns, with a grounded AI geologist agent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Analog Compass team" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
agent = [
    "anthropic>=0.40",
    "sse-starlette>=2.1",
]
pipeline = [
    # Real-data adapters. Heavy; only needed for real raster ingestion.
    "rasterio>=1.3",
    "pyproj>=3.6",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "openapi-spec-validator>=0.7",
    "jsonschema>=4.22",
    "referencing>=0.35",
    "pre-commit>=3.7",
]

[project.scripts]
analog-compass = "analog_compass.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analog_compass"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["analog_compass"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
# NumPy is untyped here (ignore_missing_imports), so we do not warn on Any returns.
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
